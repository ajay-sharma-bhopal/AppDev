name: voice_todo_app
description: A voice-enabled TODO app with multi-language support for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # Voice recognition - supports 50+ languages
  speech_to_text: ^7.0.0

  # Text-to-speech feedback
  flutter_tts: ^4.2.0

  # State management
  provider: ^6.1.1

  # Backend — Supabase (Postgres + Auth + Realtime)
  supabase_flutter: ^2.0.0

  # UUID generation for task IDs
  uuid: ^4.3.3

  # Animations
  flutter_animate: ^4.5.0

  # Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
