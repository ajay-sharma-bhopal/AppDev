name: Build VoiceTodo (APK + Web)

on:
  push:
    branches:
      - claude/voice-todo-app-U8kRV
      - main
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: voice_todo_app
        run: flutter pub get

      - name: Analyze code
        working-directory: voice_todo_app
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run tests
        working-directory: voice_todo_app
        run: flutter test
        continue-on-error: true

      - name: Build Debug APK
        working-directory: voice_todo_app
        run: |
          flutter build apk --debug \
            --no-shrink \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      - name: Build Release APK
        working-directory: voice_todo_app
        run: |
          flutter build apk --release \
            --no-shrink \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTodo-debug-${{ github.run_number }}
          path: voice_todo_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTodo-release-${{ github.run_number }}
          path: voice_todo_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: APK Info
        working-directory: voice_todo_app
        run: |
          echo "=== Build artifacts ==="
          find build/app/outputs -name "*.apk" -exec ls -lh {} \;
          echo "=== APK path ==="
          echo "Debug:   build/app/outputs/flutter-apk/app-debug.apk"
          echo "Release: build/app/outputs/flutter-apk/app-release.apk"

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: voice_todo_app
        run: flutter pub get

      - name: Build Web
        working-directory: voice_todo_app
        run: |
          flutter build web --release \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTodo-web-${{ github.run_number }}
          path: voice_todo_app/build/web/
          retention-days: 30
